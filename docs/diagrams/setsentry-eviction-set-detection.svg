<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="dg" viewBox="0 0 680 300" role="img" aria-label="SetSentry" xmlns="http://www.w3.org/2000/svg"><style>
text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
.dg-bg { fill: #020904; } .dg-grid { fill: none; stroke: #134a2a; stroke-width: 0.5; opacity: 0.6; }
.dg-group rect { fill: none; stroke: #2d6b43; stroke-dasharray: 4 4; } .dg-group text { fill: #6fb98a; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.dg-node rect, .dg-node circle, .dg-node path { fill: #08220f; stroke: #39ff7a; stroke-width: 1.4; }
.dg-node .lid { fill: none; } .dg-node .pin { stroke: #39ff7a; }
.dg-node.b rect, .dg-node.b circle, .dg-node.b path { stroke: #b6ff3b; fill: #142a08; } .dg-node.b .pin { stroke: #b6ff3b; }
.dg-node.w rect, .dg-node.w circle, .dg-node.w path { stroke: #ff4d6d; fill: #2a0c12; } .dg-node.w .pin { stroke: #ff4d6d; }
.dg-node.d rect, .dg-node.d circle, .dg-node.d path { stroke: #2d6b43; }
.dg-node .lid { fill: none; }
.dg-node .t { fill: #c9ffd9; font-weight: 700; } .dg-node.w .t { fill: #ff8fa3; } .dg-node .s { fill: #6fb98a; }
.dg-link { fill: none; stroke: #2d6b43; stroke-width: 1.4; }
.dg-link.leak, .dg-link.block { stroke: #ff4d6d; stroke-dasharray: 5 4; animation: dash 1.2s linear infinite; }
.dg-link.ctrl { stroke-dasharray: 2 4; stroke: #6fb98a; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.dg-head { fill: #2d6b43; } .dg-head.w { fill: #ff4d6d; }
.dg-dot { fill: #39ff7a; } .dg-dot.leak, .dg-dot.block { fill: #ff4d6d; }
.dg-ltext { fill: #6fb98a; font-size: 9.5px; paint-order: stroke; stroke: #020904; stroke-width: 3.5px; stroke-linejoin: round; }
.dg-ltext.leak, .dg-ltext.block { fill: #ff8fa3; }
.dg-shield path { fill: #b6ff3b; stroke: #020904; stroke-width: 1.5; } .dg-shield .tick { fill: none; stroke: #020904; stroke-width: 2; }
.dg-note { fill: #b6ff3b; font-size: 10.5px; font-weight: 700; } .dg-note.w { fill: #ff8fa3; }
.dg-node.actor circle { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { stroke-width: 3; } }</style><defs><marker id="dg9-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head"/></marker>
      <marker id="dg9-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head w"/></marker>
      <pattern id="dg9-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 L0,0 0,16" class="dg-grid"/></pattern>
      <filter id="dg9-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="url(#dg9-grid)" class="dg-bg"/><path id="dg9-p0" d="M130,65 C170,65 150,145 190,145" class="dg-link leak" marker-end="url(#dg9-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg9-p0" xlink:href="#dg9-p0"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-0.65s" repeatCount="indefinite" ><mpath href="#dg9-p0" xlink:href="#dg9-p0"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg9-p0" xlink:href="#dg9-p0"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-1.95s" repeatCount="indefinite" ><mpath href="#dg9-p0" xlink:href="#dg9-p0"/></animateMotion></circle><path id="dg9-p1" d="M130,225 C170,225 150,145 190,145" class="dg-link data" marker-end="url(#dg9-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg9-p1" xlink:href="#dg9-p1"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg9-p1" xlink:href="#dg9-p1"/></animateMotion></circle><path id="dg9-p2" d="M330,145 C381.7006769781596,145 445,137.70067697815958 445,86" class="dg-link ctrl" marker-end="url(#dg9-ar)"/><path id="dg9-p3" d="M445,86 C445,110 445,106 445,130" class="dg-link data" marker-end="url(#dg9-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg9-p3" xlink:href="#dg9-p3"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg9-p3" xlink:href="#dg9-p3"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg9-p3" xlink:href="#dg9-p3"/></animateMotion></circle><path id="dg9-p4" d="M510,158 C534,158 532,158 556,158" class="dg-link leak" marker-end="url(#dg9-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg9-p4" xlink:href="#dg9-p4"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg9-p4" xlink:href="#dg9-p4"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg9-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg9-p4" xlink:href="#dg9-p4"/></animateMotion></circle><path id="dg9-p5" d="M260,180 C260,256.0641834242635 445,147.9358165757365 445,224" class="dg-link ctrl" marker-end="url(#dg9-ar)"/><g class="dg-node box w"><rect x="20" y="40" width="110" height="50" rx="8"/><text x="75" y="60" text-anchor="middle" class="t" style="font-size:11.5px">attacker core</text><text x="75" y="75" text-anchor="middle" class="s" style="font-size:9.5px">building a set</text></g><g class="dg-node box a"><rect x="20" y="200" width="110" height="50" rx="8"/><text x="75" y="220" text-anchor="middle" class="t" style="font-size:11.5px">victim core</text><text x="75" y="235" text-anchor="middle" class="s" style="font-size:9.5px">normal work</text></g><g class="dg-node chip a"><rect x="190" y="110" width="140" height="70" rx="5"/><path d="M225,106 v4 M225,180 v4" class="pin"/><path d="M260,106 v4 M260,180 v4" class="pin"/><path d="M295,106 v4 M295,180 v4" class="pin"/><text x="260" y="140" text-anchor="middle" class="t" style="font-size:11.5px">shared L2</text><text x="260" y="155" text-anchor="middle" class="s" style="font-size:9.5px">cross-domain conflicts</text></g><g class="dg-node box b"><rect x="380" y="40" width="130" height="46" rx="8"/><text x="445" y="58" text-anchor="middle" class="t" style="font-size:11.5px">hot-set table</text><text x="445" y="73" text-anchor="middle" class="s" style="font-size:9.5px">Bloom filters</text></g><g class="dg-node pill b"><rect x="380" y="130" width="130" height="56" rx="28"/><text x="445" y="155.5" text-anchor="middle" class="t" style="font-size:11.5px">BUILD → ASSEMBLE</text><text x="445" y="168.5" text-anchor="middle" class="t" style="font-size:11.5px">→ PROBE</text></g><g class="dg-node actor w"><circle cx="608" cy="158" r="28"/><text x="608" y="155.5" text-anchor="middle" class="t" style="font-size:7.2px">machine</text><text x="608" y="168.5" text-anchor="middle" class="t" style="font-size:7.2px">interrupt</text></g><g class="dg-node box d"><rect x="380" y="224" width="130" height="40" rx="8"/><text x="445" y="239" text-anchor="middle" class="t" style="font-size:11.5px">benign workloads</text><text x="445" y="254" text-anchor="middle" class="s" style="font-size:9.5px">no alert</text></g><text x="533" y="152" class="dg-ltext leak" text-anchor="middle">alert</text></svg>