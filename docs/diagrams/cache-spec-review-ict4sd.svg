filter="url(#dg14-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg14-p7" xlink:href="#dg14-p7"/></animateMotion></circle><path id="dg14-p8" d="M337,164 C337,255.70387123780546 565,96.29612876219456 565,188" class="dg-link data" marker-end="url(#dg14-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg14-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg14-p8" xlink:href="#dg14-p8"/></animateMotion></circle><path id="dg14-p9" d="M424,216 C451.09686328710393,216 454.90313671289607,251 482,251" class="dg-link data" marker-end="url(#dg14-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg14-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg14-p9" xlink:href="#dg14-p9"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg14-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg14-p9" xlink:href="#dg14-p9"/></animateMotion></circle><g class="dg-node box d"><rect x="30" y="40" width="164" height="34" rx="8"/><text x="112" y="61" text-anchor="middle" class="t" style="font-size:9.3px">out-of-order + speculation</text></g><g class="dg-node box d"><rect x="30" y="88" width="164" height="34" rx="8"/><text x="112" y="109" text-anchor="middle" class="t" style="font-size:11.5px">branch target buffer</text></g><g class="dg-node box d"><rect x="30" y="136" width="164" height="34" rx="8"/><text x="112" y="157" text-anchor="middle" class="t" style="font-size:11.5px">return stack buffer</text></g><g class="dg-node box d"><rect x="30" y="184" width="164" height="34" rx="8"/><text x="112" y="205" text-anchor="middle" class="t" style="font-size:10.0px">store-to-load forwarding</text></g><g class="dg-node box d"><rect x="30" y="232" width="164" height="34" rx="8"/><text x="112" y="253" text-anchor="middle" class="t" style="font-size:11.5px">shared caches</text></g><g class="dg-node box w"><rect x="250" y="50" width="174" height="44" rx="8"/><text x="337" y="76" text-anchor="middle" class="t" style="font-size:10.3px">Flush+Reload, Prime+Probe</text></g><g class="dg-node box w"><rect x="250" y="120" width="174" height="44" rx="8"/><text x="337" y="146" text-anchor="middle" class="t" style="font-size:11.5px">Meltdown, Spectre</text></g><g class="dg-node box w"><rect x="250" y="190" width="174" height="52" rx="8"/><text x="337" y="213.5" text-anchor="middle" class="t" style="font-size:9.9px">GoFetch, value prediction,</text><text x="337" y="226.5" text-anchor="middle" class="t" style="font-size:9.9px">GPU and TEE attacks</text></g><g class="dg-node box b"><rect x="482" y="44" width="166" height="34" rx="8"/><text x="565" y="65" text-anchor="middle" class="t" style="font-size:10.6px">partitioning, isolation</text></g><g class="dg-node box b"><rect x="482" y="92" width="166" height="34" rx="8"/><text x="565" y="113" text-anchor="middle" class="t" style="font-size:11.5px">randomisation</text></g><g class="dg-node box b"><rect x="482" y="140" width="166" height="34" rx="8"/><text x="565" y="161" text-anchor="middle" class="t" style="font-size:11.5px">fences, microcode</text></g><g class="dg-node box b"><rect x="482" y="188" width="166" height="34" rx="8"/><text x="565" y="209" text-anchor="middle" class="t" style="font-size:11.5px">compiler hardening</text></g><g class="dg-node box b"><rect x="482" y="236" width="166" height="30" rx="8"/><text x="565" y="255" text-anchor="middle" class="t" style="font-size:11.5px">ML detection</text></g></svg>