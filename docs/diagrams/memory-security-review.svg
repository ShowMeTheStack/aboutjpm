ateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="-0.87s" repeatCount="indefinite"/></circle><circle r="2.6" class="dg-dot block" filter="url(#dg11-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg11-p6" xlink:href="#dg11-p6"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="-1.73s" repeatCount="indefinite"/></circle><g class="dg-shield" transform="translate(251,87)"><path d="M0,-11 L9,-7 L9,1 C9,7 4,10 0,12 C-4,10 -9,7 -9,1 L-9,-7 Z"/><path d="M-4,0 L-1,3 L4,-3" class="tick"/></g><g class="dg-node chip a"><rect x="20" y="110" width="110" height="60" rx="5"/><path d="M47.5,106 v4 M47.5,170 v4" class="pin"/><path d="M75,106 v4 M75,170 v4" class="pin"/><path d="M102.5,106 v4 M102.5,170 v4" class="pin"/><text x="75" y="135" text-anchor="middle" class="t" style="font-size:11.5px">CPU</text><text x="75" y="150" text-anchor="middle" class="s" style="font-size:9.5px">keys inside</text></g><g class="dg-node box b"><rect x="186" y="110" width="130" height="60" rx="8"/><text x="251" y="135" text-anchor="middle" class="t" style="font-size:11.5px">TME · SME · SEV</text><text x="251" y="150" text-anchor="middle" class="s" style="font-size:8.8px">encrypt on the way out</text></g><g class="dg-node box b"><rect x="186" y="210" width="130" height="44" rx="8"/><text x="251" y="227" text-anchor="middle" class="t" style="font-size:11.5px">Merkle trees</text><text x="251" y="242" text-anchor="middle" class="s" style="font-size:8.8px">integrity, anti-replay</text></g><g class="dg-node pill a"><rect x="370" y="110" width="100" height="60" rx="30"/><text x="420" y="144" text-anchor="middle" class="t" style="font-size:11.5px">memory bus</text></g><g class="dg-node mem a"><path d="M530,106 C530,98 658,98 658,106 L658,174 C658,182 530,182 530,174 Z"/><path d="M530,106 C530,114 658,114 658,106" class=