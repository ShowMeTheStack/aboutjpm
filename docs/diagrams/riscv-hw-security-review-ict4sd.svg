<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="dg" viewBox="0 0 680 300" role="img" aria-label="A hardware security review of RISC-V" xmlns="http://www.w3.org/2000/svg"><style>
text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
.dg-bg { fill: #020904; } .dg-grid { fill: none; stroke: #134a2a; stroke-width: 0.5; opacity: 0.6; }
.dg-group rect { fill: none; stroke: #2d6b43; stroke-dasharray: 4 4; } .dg-group text { fill: #6fb98a; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.dg-node rect, .dg-node circle, .dg-node path { fill: #08220f; stroke: #39ff7a; stroke-width: 1.4; }
.dg-node .lid { fill: none; } .dg-node .pin { stroke: #39ff7a; }
.dg-node.b rect, .dg-node.b circle, .dg-node.b path { stroke: #b6ff3b; fill: #142a08; } .dg-node.b .pin { stroke: #b6ff3b; }
.dg-node.w rect, .dg-node.w circle, .dg-node.w path { stroke: #ff4d6d; fill: #2a0c12; } .dg-node.w .pin { stroke: #ff4d6d; }
.dg-node.d rect, .dg-node.d circle, .dg-node.d path { stroke: #2d6b43; }
.dg-node .lid { fill: none; }
.dg-node .t { fill: #c9ffd9; font-weight: 700; } .dg-node.w .t { fill: #ff8fa3; } .dg-node .s { fill: #6fb98a; }
.dg-link { fill: none; stroke: #2d6b43; stroke-width: 1.4; }
.dg-link.leak, .dg-link.block { stroke: #ff4d6d; stroke-dasharray: 5 4; animation: dash 1.2s linear infinite; }
.dg-link.ctrl { stroke-dasharray: 2 4; stroke: #6fb98a; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.dg-head { fill: #2d6b43; } .dg-head.w { fill: #ff4d6d; }
.dg-dot { fill: #39ff7a; } .dg-dot.leak, .dg-dot.block { fill: #ff4d6d; }
.dg-ltext { fill: #6fb98a; font-size: 9.5px; paint-order: stroke; stroke: #020904; stroke-width: 3.5px; stroke-linejoin: round; }
.dg-ltext.leak, .dg-ltext.block { fill: #ff8fa3; }
.dg-shield path { fill: #b6ff3b; stroke: #020904; stroke-width: 1.5; } .dg-shield .tick { fill: none; stroke: #020904; stroke-width: 2; }
.dg-note { fill: #b6ff3b; font-size: 10.5px; font-weight: 700; } .dg-note.w { fill: #ff8fa3; }
.dg-node.actor circle { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { stroke-width: 3; } }</style><defs><marker id="dg15-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head"/></marker>
      <marker id="dg15-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head w"/></marker>
      <pattern id="dg15-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 L0,0 0,16" class="dg-grid"/></pattern>
      <filter id="dg15-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="url(#dg15-grid)" class="dg-bg"/><path id="dg15-p0" d="M110,66 C110,138.28388478768971 197.71611521231029,150 270,150" class="dg-link leak" marker-end="url(#dg15-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p0" xlink:href="#dg15-p0"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg15-p0" xlink:href="#dg15-p0"/></animateMotion></circle><path id="dg15-p1" d="M190,150 C222,150 238,150 270,150" class="dg-link leak" marker-end="url(#dg15-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p1" xlink:href="#dg15-p1"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg15-p1" xlink:href="#dg15-p1"/></animateMotion></circle><path id="dg15-p2" d="M110,234 C110,161.71611521231029 197.71611521231029,150 270,150" class="dg-link leak" marker-end="url(#dg15-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p2" xlink:href="#dg15-p2"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg15-p2" xlink:href="#dg15-p2"/></animateMotion></circle><path id="dg15-p3" d="M410,150 C485.56612997897935,150 575,133.56612997897935 575,58" class="dg-link data" marker-end="url(#dg15-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p3" xlink:href="#dg15-p3"/></animateMotion></circle><path id="dg15-p4" d="M410,150 C477.2297553171213,150 575,185.22975531712132 575,118" class="dg-link data" marker-end="url(#dg15-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p4" xlink:href="#dg15-p4"/></animateMotion></circle><path id="dg15-p5" d="M410,150 C442.2490309931942,150 457.7509690068058,160 490,160" class="dg-link data" marker-end="url(#dg15-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p5" xlink:href="#dg15-p5"/></animateMotion></circle><path id="dg15-p6" d="M410,150 C479.2,150 575,132.8 575,202" class="dg-link data" marker-end="url(#dg15-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p6" xlink:href="#dg15-p6"/></animateMotion></circle><path id="dg15-p7" d="M410,150 C488.44590492817326,150 575,177.55409507182674 575,256" class="dg-link data" marker-end="url(#dg15-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg15-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg15-p7" xlink:href="#dg15-p7"/></animateMotion></circle><g class="dg-node chip a"><rect x="270" y="112" width="140" height="76" rx="5"/><path d="M305,108 v4 M305,188 v4" class="pin"/><path d="M340,108 v4 M340,188 v4" class="pin"/><path d="M375,108 v4 M375,188 v4" class="pin"/><text x="340" y="145" text-anchor="middle" class="t" style="font-size:11.5px">10 RISC-V cores</text><text x="340" y="160" text-anchor="middle" class="s" style="font-size:7.0px">BOOM, CVA6, Rocket,
Shakti, XiangShan…</text></g><g class="dg-node box w"><rect x="30" y="30" width="160" height="36" rx="8"/><text x="110" y="52" text-anchor="middle" class="t" style="font-size:11.2px">cache and speculation</text></g><g class="dg-node box w"><rect x="30" y="132" width="160" height="36" rx="8"/><text x="110" y="154" text-anchor="middle" class="t" style="font-size:11.5px">power: SPA, DPA, CPA</text></g><g class="dg-node box w"><rect x="30" y="234" width="160" height="36" rx="8"/><text x="110" y="256" text-anchor="middle" class="t" style="font-size:11.5px">fault injection (EM)</text></g><g class="dg-node box b"><rect x="490" y="22" width="170" height="36" rx="8"/><text x="575" y="44" text-anchor="middle" class="t" style="font-size:11.5px">TEEs: Sanctum, Dorami</text></g><g class="dg-node box b"><rect x="490" y="82" width="170" height="36" rx="8"/><text x="575" y="104" text-anchor="middle" class="t" style="font-size:11.4px">secure boot, PUF roots</text></g><g class="dg-node box b"><rect x="490" y="142" width="170" height="36" rx="8"/><text x="575" y="164" text-anchor="middle" class="t" style="font-size:11.5px">crypto ISA, PQC</text></g><g class="dg-node box b"><rect x="490" y="202" width="170" height="36" rx="8"/><text x="575" y="224" text-anchor="middle" class="t" style="font-size:11.5px">memory encryption</text></g><g class="dg-node box b"><rect x="490" y="256" width="170" height="30" rx="8"/><text x="575" y="275" text-anchor="middle" class="t" style="font-size:11.5px">masking, hiding</text></g></svg>