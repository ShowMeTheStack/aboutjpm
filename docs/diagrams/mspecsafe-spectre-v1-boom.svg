<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="dg" viewBox="0 0 680 280" role="img" aria-label="mspecsafe" xmlns="http://www.w3.org/2000/svg"><style>
text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
.dg-bg { fill: #020904; } .dg-grid { fill: none; stroke: #134a2a; stroke-width: 0.5; opacity: 0.6; }
.dg-group rect { fill: none; stroke: #2d6b43; stroke-dasharray: 4 4; } .dg-group text { fill: #6fb98a; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.dg-node rect, .dg-node circle, .dg-node path { fill: #08220f; stroke: #39ff7a; stroke-width: 1.4; }
.dg-node .lid { fill: none; } .dg-node .pin { stroke: #39ff7a; }
.dg-node.b rect, .dg-node.b circle, .dg-node.b path { stroke: #b6ff3b; fill: #142a08; } .dg-node.b .pin { stroke: #b6ff3b; }
.dg-node.w rect, .dg-node.w circle, .dg-node.w path { stroke: #ff4d6d; fill: #2a0c12; } .dg-node.w .pin { stroke: #ff4d6d; }
.dg-node.d rect, .dg-node.d circle, .dg-node.d path { stroke: #2d6b43; }
.dg-node .lid { fill: none; }
.dg-node .t { fill: #c9ffd9; font-weight: 700; } .dg-node.w .t { fill: #ff8fa3; } .dg-node .s { fill: #6fb98a; }
.dg-link { fill: none; stroke: #2d6b43; stroke-width: 1.4; }
.dg-link.leak, .dg-link.block { stroke: #ff4d6d; stroke-dasharray: 5 4; animation: dash 1.2s linear infinite; }
.dg-link.ctrl { stroke-dasharray: 2 4; stroke: #6fb98a; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.dg-head { fill: #2d6b43; } .dg-head.w { fill: #ff4d6d; }
.dg-dot { fill: #39ff7a; } .dg-dot.leak, .dg-dot.block { fill: #ff4d6d; }
.dg-ltext { fill: #6fb98a; font-size: 9.5px; paint-order: stroke; stroke: #020904; stroke-width: 3.5px; stroke-linejoin: round; }
.dg-ltext.leak, .dg-ltext.block { fill: #ff8fa3; }
.dg-shield path { fill: #b6ff3b; stroke: #020904; stroke-width: 1.5; } .dg-shield .tick { fill: none; stroke: #020904; stroke-width: 2; }
.dg-note { fill: #b6ff3b; font-size: 10.5px; font-weight: 700; } .dg-note.w { fill: #ff8fa3; }
.dg-node.actor circle { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { stroke-width: 3; } }</style><defs><marker id="dg6-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head"/></marker>
      <marker id="dg6-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head w"/></marker>
      <pattern id="dg6-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 L0,0 0,16" class="dg-grid"/></pattern>
      <filter id="dg6-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="url(#dg6-grid)" class="dg-bg"/><path id="dg6-p0" d="M138,137 C162,137 158,137 182,137" class="dg-link ctrl" marker-end="url(#dg6-ar)"/><path id="dg6-p1" d="M300,137 C324,137 322,139 346,139" class="dg-link block" marker-end="url(#dg6-arw)"/><circle r="2.6" class="dg-dot block" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg6-p1" xlink:href="#dg6-p1"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="2.6" class="dg-dot block" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg6-p1" xlink:href="#dg6-p1"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="-0.87s" repeatCount="indefinite"/></circle><circle r="2.6" class="dg-dot block" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg6-p1" xlink:href="#dg6-p1"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="-1.73s" repeatCount="indefinite"/></circle><g class="dg-shield" transform="translate(307,138)"><path d="M0,-11 L9,-7 L9,1 C9,7 4,10 0,12 C-4,10 -9,7 -9,1 L-9,-7 Z"/><path d="M-4,0 L-1,3 L4,-3" class="tick"/></g><path id="dg6-p2" d="M412,162 C412,186 412,176 412,200" class="dg-link leak" marker-end="url(#dg6-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg6-p2" xlink:href="#dg6-p2"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg6-p2" xlink:href="#dg6-p2"/></animateMotion></circle><path id="dg6-p3" d="M412,76 C412,100 412,92 412,116" class="dg-link ctrl" marker-end="url(#dg6-ar)"/><path id="dg6-p4" d="M478,223 C506.1026689124005,223 519.8973310875995,217 548,217" class="dg-link leak" marker-end="url(#dg6-arw)"/><circle r="2.6" class="dg-dot leak" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg6-p4" xlink:href="#dg6-p4"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg6-p4" xlink:href="#dg6-p4"/></animateMotion></circle><circle r="2.6" class="dg-dot leak" filter="url(#dg6-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg6-p4" xlink:href="#dg6-p4"/></animateMotion></circle><g class="dg-node box d"><rect x="20" y="110" width="118" height="54" rx="8"/><text x="79" y="132" text-anchor="middle" class="t" style="font-size:11.5px">if (x &lt; len)</text><text x="79" y="147" text-anchor="middle" class="s" style="font-size:9.5px">mispredicted</text></g><g class="dg-node box w"><rect x="182" y="110" width="118" height="54" rx="8"/><text x="241" y="132" text-anchor="middle" class="t" style="font-size:11.5px">load a[x]</text><text x="241" y="147" text-anchor="middle" class="s" style="font-size:7.6px">runs ahead of the check</text></g><g class="dg-node chip b"><rect x="346" y="30" width="132" height="46" rx="5"/><path d="M379,26 v4 M379,76 v4" class="pin"/><path d="M412,26 v4 M412,76 v4" class="pin"/><path d="M445,26 v4 M445,76 v4" class="pin"/><text x="412" y="48" text-anchor="middle" class="t" style="font-size:11.5px">mspecsafe</text><text x="412" y="63" text-anchor="middle" class="s" style="font-size:9.5px">CSR 0x80E: nack</text></g><g class="dg-node box a"><rect x="346" y="116" width="132" height="46" rx="8"/><text x="412" y="134" text-anchor="middle" class="t" style="font-size:11.5px">MSHR</text><text x="412" y="149" text-anchor="middle" class="s" style="font-size:9.5px">miss handling</text></g><g class="dg-node box a"><rect x="346" y="200" width="132" height="46" rx="8"/><text x="412" y="218" text-anchor="middle" class="t" style="font-size:11.5px">data cache</text><text x="412" y="233" text-anchor="middle" class="s" style="font-size:8.9px">secret line installed?</text></g><g class="dg-node actor w"><circle cx="598" cy="217" r="37"/><text x="598" y="214.5" text-anchor="middle" class="t" style="font-size:7.6px">attacker</text><text x="598" y="227.5" text-anchor="middle" class="t" style="font-size:7.6px">times reload</text></g><text x="323" y="121" class="dg-ltext block" text-anchor="middle">miss</text><text x="513" y="214" class="dg-ltext leak" text-anchor="middle">hit = 1, miss = 0</text></svg>