      <pattern id="dg12-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 L0,0 0,16" class="dg-grid"/></pattern>
      <filter id="dg12-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="url(#dg12-grid)" class="dg-bg"/><path id="dg12-p0" d="M130,138 C154,138 166,138 190,138" class="dg-link data" marker-end="url(#dg12-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg12-p0" xlink:href="#dg12-p0"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg12-p0" xlink:href="#dg12-p0"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg12-p0" xlink:href="#dg12-p0"/></animateMotion></circle><path id="dg12-p1" d="M340,138 C368,138 382,138 410,138" class="dg-link data" marker-end="url(#dg12-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg12-p1" xlink:href="#dg12-p1"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-1.30s" repeatCount="indefinite" ><mpath href="#dg12-p1" xlink:href="#dg12-p1"/></animateMotion></circle><path id="dg12-p2" d="M560,138 C536,138 544,138 520,138" class="dg-link data" marker-end="url(#dg12-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg12-p2" xlink:href="#dg12-p2"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg12-p2" xlink:href="#dg12-p2"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg12-p2" xlink:href="#dg12-p2"/></animateMotion></circle><path id="dg12-p3" d="M265,66 C265,90 265,80 265,104" class="dg-link ctrl" marker-end="url(#dg12-ar)"/><path id="dg12-p4" d="M265,214 C265,190 265,196 265,172" class="dg-link ctrl" marker-end="url(#dg12-ar)"/><path id="dg12-p5" d="M610,172 C610,310.85694076998817 478.85694076998817,237 340,237" class="dg-link block" marker-end="url(#dg12-arw)"/><circle r="2.6" class="dg-dot block" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg12-p5" xlink:href="#dg12-p5"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="0.00s" repeatCount="indefinite"/></circle><circle r="2.6" class="dg-dot block" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg12-p5" xlink:href="#dg12-p5"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="-0.87s" repeatCount="indefinite"/></circle><circle r="2.6" class="dg-dot block" filter="url(#dg12-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" keyPoints="0;0.5;0.5" keyTimes="0;0.8;1" calcMode="linear"><mpath href="#dg12-p5" xlink:href="#dg12-p5"/></animateMotion><animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="2.6s" begin="-1.73s" repeatCount="indefinite"/></circle><g class="dg-shield" transform="translate(475,204.5)"><path d="M0,-11 L9,-7 L9,1 C9,7 4,10 0,12 C-4,10 -9,7 -9,1 L-9,-7 Z"/><path d="M-4,0 L-1,3 L4,-3" class="tick"/></g><g class="dg-node box a"><rect x="20" y="110" width="110" height="56" rx="8"/><text x="75" y="133" text-anchor="middle" class="t" style="font-size:11.5px">CPU</text><text x="75" y="1