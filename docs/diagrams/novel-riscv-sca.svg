 filter="url(#dg4-glow)"><animateMotion dur="2.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg4-p8" xlink:href="#dg4-p8"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg4-p8" xlink:href="#dg4-p8"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg4-p8" xlink:href="#dg4-p8"/></animateMotion></circle><g class="dg-node box d"><rect x="20" y="30" width="96" height="34" rx="8"/><text x="68" y="51" text-anchor="middle" class="t" style="font-size:11.5px">Rocket</text></g><g class="dg-node box d"><rect x="20" y="74" width="96" height="34" rx="8"/><text x="68" y="95" text-anchor="middle" class="t" style="font-size:11.5px">VexiiRiscv</text></g><g class="dg-node box d"><rect x="20" y="118" width="96" height="34" rx="8"/><text x="68" y="139" text-anchor="middle" class="t" style="font-size:11.5px">CVA6</text></g><g class="dg-node box d"><rect x="20" y="162" width="96" height="34" rx="8"/><text x="68" y="183" text-anchor="middle" class="t" style="font-size:11.5px">BOOM M</text></g><g class="dg-node box d"><rect x="20" y="206" width="96" height="34" rx="8"/><text x="68" y="227" text-anchor="middle" class="t" style="font-size:11.5px">BOOM L</text></g><g class="dg-node box d"><rect x="20" y="250" width="96" height="34" rx="8"/><text x="68" y="271" text-anchor="middle" class="t" style="font-size:11.5px">BOOM Mega</text></g><g class="dg-node box a"><rect x="176" y="110" width="120" height="56" rx="8"/><text x="236" y="133" text-anchor="middle" class="t" style="font-size:11.5px">TVLA + attack</text><text x="236" y="148" text-anchor="middle" class="s" style="font-size:9.5px">Wilson 95% CI</text></g><g class="dg-node pill w"><rect x="346" y="104" width="120" height="68" rx="34"/><text x="406" y="133" text-anchor="middle" class="t" style="font-size:11.5px">23 channels</text><text x="406" y="148" text-anchor="middle" class="s" style="font-size:8.9px">6 new, e.g. PMPectre</text></g><g class="dg-node chip a"><rect x="518" y="40" width="140" height="54" rx="5"/><path d="M553,36 v4 M553,94 v4" class="pin"/><path d="M588,36 v4 M588,94 v4" class="pin"/><path d="M623,36 v4 M623,94 v4" class="pin"/><text x="588" y="62" text-anchor="middle" class="t" style="font-size:11.5px">Zedboard FPGA</text><text x="588" y="77" text-anchor="middle" class="s" style="font-size:9.5px">read out over JTAG</text></g><g class="dg-node box b"><rect x="518" y="190" width="140" height="60" rx="8"/><text x="588" y="215" text-anchor="middle" class="t" style="font-size:11.5px">8 mitigations</text><text x="588" y="230" text-anchor="middle" class="s" style="font-size:9.5px">6 cost ≤ 0.8% area</text></g><text x="527" y="110" class="dg-ltext leak" text-anchor="middle">confirm on silicon</text><text x="462" y="190" class="dg-ltext data" text-anchor="middle">close</text></svg>