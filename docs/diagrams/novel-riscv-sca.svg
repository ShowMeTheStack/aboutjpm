<svg xmlns:xlink="http://www.w3.org/1999/xlink" class="dg" viewBox="0 0 680 300" role="img" aria-label="New side channels on open RISC-V cores" xmlns="http://www.w3.org/2000/svg"><style>
text { font-family: "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace; }
.dg-bg { fill: #020904; } .dg-grid { fill: none; stroke: #134a2a; stroke-width: 0.5; opacity: 0.6; }
.dg-group rect { fill: none; stroke: #2d6b43; stroke-dasharray: 4 4; } .dg-group text { fill: #6fb98a; font-size: 10px; letter-spacing: 0.08em; text-transform: uppercase; }
.dg-node rect, .dg-node circle, .dg-node path { fill: #08220f; stroke: #39ff7a; stroke-width: 1.4; }
.dg-node .lid { fill: none; } .dg-node .pin { stroke: #39ff7a; }
.dg-node.b rect, .dg-node.b circle, .dg-node.b path { stroke: #b6ff3b; fill: #142a08; } .dg-node.b .pin { stroke: #b6ff3b; }
.dg-node.w rect, .dg-node.w circle, .dg-node.w path { stroke: #ff4d6d; fill: #2a0c12; } .dg-node.w .pin { stroke: #ff4d6d; }
.dg-node.d rect, .dg-node.d circle, .dg-node.d path { stroke: #2d6b43; }
.dg-node .lid { fill: none; }
.dg-node .t { fill: #c9ffd9; font-weight: 700; } .dg-node.w .t { fill: #ff8fa3; } .dg-node .s { fill: #6fb98a; }
.dg-link { fill: none; stroke: #2d6b43; stroke-width: 1.4; }
.dg-link.leak, .dg-link.block { stroke: #ff4d6d; stroke-dasharray: 5 4; animation: dash 1.2s linear infinite; }
.dg-link.ctrl { stroke-dasharray: 2 4; stroke: #6fb98a; }
@keyframes dash { to { stroke-dashoffset: -18; } }
.dg-head { fill: #2d6b43; } .dg-head.w { fill: #ff4d6d; }
.dg-dot { fill: #39ff7a; } .dg-dot.leak, .dg-dot.block { fill: #ff4d6d; }
.dg-ltext { fill: #6fb98a; font-size: 9.5px; paint-order: stroke; stroke: #020904; stroke-width: 3.5px; stroke-linejoin: round; }
.dg-ltext.leak, .dg-ltext.block { fill: #ff8fa3; }
.dg-shield path { fill: #b6ff3b; stroke: #020904; stroke-width: 1.5; } .dg-shield .tick { fill: none; stroke: #020904; stroke-width: 2; }
.dg-note { fill: #b6ff3b; font-size: 10.5px; font-weight: 700; } .dg-note.w { fill: #ff8fa3; }
.dg-node.actor circle { animation: pulse 2.4s ease-in-out infinite; } @keyframes pulse { 50% { stroke-width: 3; } }</style><defs><marker id="dg4-ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head"/></marker>
      <marker id="dg4-arw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="dg-head w"/></marker>
      <pattern id="dg4-grid" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M16,0 L0,0 0,16" class="dg-grid"/></pattern>
      <filter id="dg4-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect width="100%" height="100%" fill="url(#dg4-grid)" class="dg-bg"/><path id="dg4-p0" d="M68,64 C68,133.67352438336962 236,40.32647561663039 236,110" class="dg-link data" marker-end="url(#dg4-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="3.2s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg4-p0" xlink:href="#dg4-p0"/></animateMotion></circle><path id="dg4-p1" d="M116,91 C146.48671841966598,91 145.51328158033402,138 176,138" class="dg-link data" marker-end="url(#dg4-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="3.4s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg4-p1" xlink:href="#dg4-p1"/></animateMotion></circle><path id="dg4-p2" d="M116,135 C140.02998127340095,135 151.97001872659905,138 176,138" class="dg-link data" marker-end="url(#dg4-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="3s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg4-p2" xlink:href="#dg4-p2"/></animateMotion></circle><path id="dg4-p3" d="M116,179 C145.06819567843866,179 146.93180432156134,138 176,138" class="dg-link data" marker-end="url(#dg4-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="3.6s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg4-p3" xlink:href="#dg4-p3"/></animateMotion></circle><path id="dg4-p4" d="M68,206 C68,136.9214939362467 236,235.0785060637533 236,166" class="dg-link data" marker-end="url(#dg4-ar)"/><circle r="3" class="dg-dot data" filter="url(#dg4-glow)"><animateMotion dur="3.1s" begin="0.00s" repeatCount="indefinite" ><mpath href="#dg4-p4" xlink:href="#dg4-p4"/></animateMotion></circle><path id="dg4-p5" d="M68,250 C68,174.86811595600705 236,241.13188404399295 236,166" class="dg-link