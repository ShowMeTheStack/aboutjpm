 filter="url(#dg13-glow)"><animateMotion dur="2.6s" begin="-0.87s" repeatCount="indefinite" ><mpath href="#dg13-p6" xlink:href="#dg13-p6"/></animateMotion></circle><circle r="3" class="dg-dot data" filter="url(#dg13-glow)"><animateMotion dur="2.6s" begin="-1.73s" repeatCount="indefinite" ><mpath href="#dg13-p6" xlink:href="#dg13-p6"/></animateMotion></circle><g class="dg-node box d"><rect x="20" y="40" width="110" height="46" rx="8"/><text x="75" y="58" text-anchor="middle" class="t" style="font-size:11.5px">class file</text><text x="75" y="73" text-anchor="middle" class="s" style="font-size:9.5px">a new process</text></g><g class="dg-node box b"><rect x="176" y="40" width="150" height="46" rx="8"/><text x="251" y="58" text-anchor="middle" class="t" style="font-size:11.5px">static detector</text><text x="251" y="73" text-anchor="middle" class="s" style="font-size:9.4px">opcode n-grams · RF / NN</text></g><g class="dg-node box a"><rect x="176" y="126" width="150" height="56" rx="8"/><text x="251" y="149" text-anchor="middle" class="t" style="font-size:10.9px">Java kernel on a JVM</text><text x="251" y="164" text-anchor="middle" class="s" style="font-size:9.5px">JNI to C and assembly</text></g><g class="dg-node chip a"><rect x="380" y="126" width="120" height="56" rx="5"/><path d="M410,122 v4 M410,182 v4" class="pin"/><path d="M440,122 v4 M440,182 v4" class="pin"/><path d="M470,122 v4 M470,182 v4" class="pin"/><text x="440" y="149" text-anchor="middle" class="t" style="font-size:10.7px">10 QEMU monitors</text><text x="440" y="164" text-anchor="middle" class="s" style="font-size:7.0px">branches, jumps, syscalls…</text></g><g class="dg-node box b"><rect x="540" y="126" width="120" height="56" rx="8"/><text x="600" y="149" text-anchor="middle" class="t" style="font-size:10.7px">runtime detector</text><text x="600" y="164" text-anchor="middle" class="s" style="font-size:8.9px">HMM · LSTM · iForest</text></g><g class="dg-node chip b"><rect x="176" y="222" width="150" heigh