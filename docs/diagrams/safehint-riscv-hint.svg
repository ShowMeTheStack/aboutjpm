dth="130" height="60" rx="8"/><text x="85" y="135" text-anchor="middle" class="t" style="font-size:11.5px">program</text><text x="85" y="150" text-anchor="middle" class="s" style="font-size:8.8px">rd = x0 HINT directive</text></g><g class="dg-node pill b"><rect x="200" y="40" width="130" height="44" rx="22"/><text x="265" y="57" text-anchor="middle" class="t" style="font-size:11.5px">read useccap</text><text x="265" y="72" text-anchor="middle" class="s" style="font-size:9.5px">at start-up</text></g><g class="dg-node box d"><rect x="420" y="30" width="230" height="46" rx="8"/><text x="535" y="48" text-anchor="middle" class="t" style="font-size:11.5px">unaware core</text><text x="535" y="63" text-anchor="middle" class="s" style="font-size:9.5px">no-op · useccap traps: canary</text></g><g class="dg-node box w"><rect x="420" y="118" width="230" height="46" rx="8"/><text x="535" y="136" text-anchor="middle" class="t" style="font-size:11.5px">partly aware core</text><text x="535" y="151" text-anchor="middle" class="s" style="font-size:9.5px">usecctl: trap if not honoured</text></g><g class="dg-node box b"><rect x="420" y="206" width="230" height="46" rx="8"/><text x="535" y="224" text-anchor="middle" class="t" style="font-size:11.5px">aware core</text><text x="535" y="239" text-anchor="middle" class="s" style="font-size:9.5px">directive honoured (barrier)</text></g><text x="20" y="270" class="dg-note b" text-anchor="start">fail-closed: never silently insecure</text></svg>